# Enable secure (HTTPS) metrics on the controller for TLS-Scanner compliance.
# Uses service-CA-signed certificates from the metrics Service annotation.
#
# On OpenShift the service-ca operator populates the TLS secret within seconds
# of the annotated Service being created — well before pod scheduling and image
# pull complete — so the volume is available at container start in practice.
# optional: true is set so that non-OpenShift CI clusters (KIND) can still
# start the pod; controller-runtime falls back to self-signed certs when the
# directory is empty.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--secure-metrics=true"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--metrics-cert-dir=/etc/metrics-certs"
- op: add
  path: /spec/template/metadata/annotations/prometheus.io~1scheme
  value: "https"
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: metrics-serving-certs
    mountPath: /etc/metrics-certs
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: metrics-serving-certs
    secret:
      secretName: spark-operator-controller-metrics-certs
      optional: true
